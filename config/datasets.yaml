# DoppelGrund datasets: every dataset the pipeline may use. HUMAN-OWNED (task 00/0.8).
#
# Schema per entry (keys below are the ones code looks up):
#   id_or_url: str     Earth Engine asset ID or download URL / catalogue record
#   access:    ee | download
#   version:   str     product version or download date
#   licence:   str
#   citation:  str
#   verified:  bool    true only after a human confirmed the entry against the challenge
#                      Resources tab or the catalogue page
# Optional per-entry keys (band, bands, scale, years, class codes) are added by humans.
# Starting-point IDs are listed in .kiro/specs/00-foundation/design.md §2; they are NOT copied
# here (override O2: agents never fill dataset values). Code warns when verified is false.
earth_dem:        {id_or_url: "", access: ee, version: "", licence: "", citation: "", verified: false}
earth_lst_terra:  {id_or_url: "", access: ee, version: "", licence: "", citation: "", verified: false}
